<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAY!</title>
    <style>
        /* Centers everything and sets the light purple background */
        body {
            background-color: #E6E6FA; /* Soft Lavender / Light Purple */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            color: #33334d;
            text-align: center;
        }

        /* Container that stretches out the text to cover the page beautifully */
        .content-container {
            max-width: 800px;
            width: 100%;
        }

        /* Large, prominent heading matching your layout */
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #4b0082; /* Indigo twist */
            animation: heartbeat 1.2s infinite;
        }

        /* Second large heading from your text */
        h2 {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #ff4d6d; /* Romantic pink/red */
        }

        /* Large, easily readable paragraphs spread across the screen */
        p {
            font-size: 1.6rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        /* Cute pulsing animation for the heart title text */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.05); }
            40% { transform: scale(1); }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-container">
        <!-- Kept exactly from your text snippet -->
        <h1>YAY</h1>
        
        <h2>YAYYYYY ❤</h2>

        <p>I'm really happy you said yes! :)</p>

        <p>Thank you for giving me a chance</p>
    </div>

</body>
</html>
